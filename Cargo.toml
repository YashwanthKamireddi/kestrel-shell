[package]
name = "kestrel"
description = "A native desktop shell for Hyprland"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.98"

[workspace]
members = [".", "crates/kestrel-services"]
exclude = ["tools/pointer"]

[dependencies]
kestrel-services = { path = "crates/kestrel-services" }
iced = { package = "iced_layershell", path = "vendor/iced_layershell", default-features = false, features = [
  "tokio",
  "advanced",
  "tiny-skia",
  "image",
  "svg",
  "canvas",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "process", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libpulse-binding = { version = "2.30", features = ["pa_v15"] }
inotify = { version = "0.11", default-features = false, features = ["stream"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
mlua = { version = "0.11", features = ["lua54", "vendored"] }
material-colors = { version = "0.5", features = ["quantize"] }

[patch.crates-io]
# wl_shm Argb8888 so the CPU renderer keeps alpha on Wayland.
softbuffer = { git = "https://github.com/MalpenZibo/softbuffer", branch = "wayland-argb" }
# 8×8 anti-aliasing samples per pixel instead of 4×4 (vendor/tiny-skia, one constant): curves
# on 1x screens (pills, circles, rings) get 64 shades along their edge instead of 16.
tiny-skia = { path = "vendor/tiny-skia" }

[profile.release]
lto = "thin"
strip = true
opt-level = 3
# Unwind, so a bug in one module is caught (guard::run) instead of ending the shell.
panic = "unwind"
