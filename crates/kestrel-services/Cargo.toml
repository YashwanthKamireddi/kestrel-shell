[package]
name = "kestrel-services"
description = "kestrel's system integration: state streams and commands, no UI"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "process", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libpulse-binding = { version = "2.30", features = ["pa_v15"] }
inotify = { version = "0.11", default-features = false, features = ["stream"] }
libc = "0.2"
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
